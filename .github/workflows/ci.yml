name: Python baseline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m stat_agent analyze examples/data/pca.csv --goal 'PCA' --predictors x1 x2 x3 --out runs/ci
      - run: python evaluation/run.py --out runs/evaluation.json
      - run: python evaluation/expanded.py --out runs/expanded.json
      - run: python evaluation/profile_quality.py
      - run: python -m stat_agent kb restore --db runs/ci-knowledge.sqlite3
      - run: python evaluation/cran_database.py --db runs/ci-knowledge.sqlite3 --out runs/cran-search.json
      - run: python -m stat_agent profile examples/data/pca.csv --out runs/ci-profile-only
